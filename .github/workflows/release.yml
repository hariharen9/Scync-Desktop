name: release

# Push a tag like v1.2.3 to build every platform and publish a GitHub Release.
# Tags with a suffix (v1.2.3-beta.1) are marked as a pre-release.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v1.2.3)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── Windows: x64 + ARM64 ────────────────────────────────────────────────
  windows:
    name: Windows ${{ matrix.args }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - args: 'x86_64-pc-windows-msvc'
            target: ''
          - args: 'aarch64-pc-windows-msvc'
            target: '--target aarch64-pc-windows-msvc'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.args }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.args }}

      - name: Sync version from tag
        shell: bash
        run: node scripts/sync-version.mjs "${{ github.event.inputs.tag || github.ref_name }}"

      # Client id/secret are compiled in from repo secrets; empty values
      # disable Google sign-in with a clear UI message.
      - name: Inject Google client
        shell: bash
        env:
          SCYNC_GOOGLE_CLIENT_ID: ${{ secrets.SCYNC_GOOGLE_CLIENT_ID }}
          SCYNC_GOOGLE_CLIENT_SECRET: ${{ secrets.SCYNC_GOOGLE_CLIENT_SECRET }}
        run: node scripts/generate-google-client.mjs

      - run: npm ci
      - name: Build bundles
        run: npm run tauri build -- ${{ matrix.target }} --ci

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.args }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi

  # ─── macOS: Intel + Apple Silicon (universal app bundle) ─────────────────
  macos:
    name: macOS ${{ matrix.args }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - args: 'x86_64-apple-darwin'
            target: '--target x86_64-apple-darwin'
          - args: 'aarch64-apple-darwin'
            target: '--target aarch64-apple-darwin'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.args }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.args }}

      - name: Sync version from tag
        run: node scripts/sync-version.mjs "${{ github.event.inputs.tag || github.ref_name }}"

      - name: Inject Google client
        env:
          SCYNC_GOOGLE_CLIENT_ID: ${{ secrets.SCYNC_GOOGLE_CLIENT_ID }}
          SCYNC_GOOGLE_CLIENT_SECRET: ${{ secrets.SCYNC_GOOGLE_CLIENT_SECRET }}
        run: node scripts/generate-google-client.mjs

      - run: npm ci
      - name: Build bundles
        run: npm run tauri build -- ${{ matrix.target }} --ci

      # Unsigned by design until signing credentials exist (see README).
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.args }}
          if-no-files-found: error
          path: src-tauri/target/**/release/bundle/dmg/*.dmg

  # ─── Linux: x64 + ARM64 ──────────────────────────────────────────────────
  linux:
    name: Linux ${{ matrix.args }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - args: 'x86_64-unknown-linux-gnu'
            target: ''
            deps: 'libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev'
          - args: 'aarch64-unknown-linux-gnu'
            target: '--target aarch64-unknown-linux-gnu'
            deps: 'libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.deps }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.args }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.args }}

      - name: Sync version from tag
        run: node scripts/sync-version.mjs "${{ github.event.inputs.tag || github.ref_name }}"

      - name: Inject Google client
        env:
          SCYNC_GOOGLE_CLIENT_ID: ${{ secrets.SCYNC_GOOGLE_CLIENT_ID }}
          SCYNC_GOOGLE_CLIENT_SECRET: ${{ secrets.SCYNC_GOOGLE_CLIENT_SECRET }}
        run: node scripts/generate-google-client.mjs

      - run: npm ci

      - name: Configure cross-compilation (ARM64)
        if: matrix.args == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"

      - name: Build bundles
        run: npm run tauri build -- ${{ matrix.target }} --ci

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.args }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage

  # ─── Publish ─────────────────────────────────────────────────────────────
  release:
    name: Publish release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect assets
        run: |
          mkdir -p release
          find dist -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} release/ \;
          echo "Collected:"; ls -la release/

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release/*
          generate_release_notes: true
          # v1.2.3-beta.1 / -rc.1 are published as pre-releases.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          fail_on_unmatched_files: true
